backend:
  name: github
  repo: heather934/SongBirdPublishingLLC.com
  branch: main
  base_url: https://songbird-cms-auth.h-m-ward1846.workers.dev

media_folder: src/assets/uploads
public_folder: /assets/uploads

collections:
  # ---------------------------------------------------------------- Authors
  - name: authors
    label: Authors
    label_singular: Author
    folder: src/authors
    create: true
    delete: true
    slug: "{{name}}"
    summary: "{{name}} — {{genre}}"
    sortable_fields: [order, name]
    fields:
      - { name: name, label: Name, widget: string }
      - { name: genre, label: Genre or role, widget: string, required: false, hint: "Shown under the name, e.g. Fiction, Memoir, Poetry" }
      - { name: photo, label: Photo, widget: image, required: false, hint: "Square works best. Leave empty to show the initial instead." }
      - { name: order, label: Order on the page, widget: number, default: 1, value_type: int, min: 1 }
      - { name: body, label: Bio, widget: markdown, hint: "Two or three sentences." }

  # ------------------------------------------------------------------ Notes
  - name: posts
    label: Notes
    label_singular: Note
    folder: src/posts
    create: true
    delete: true
    slug: "{{title}}"
    summary: "{{title}} — {{date}}"
    sortable_fields: [date, title]
    fields:
      - { name: title, label: Title, widget: string }
      - { name: date, label: Date, widget: datetime, date_format: "YYYY-MM-DD", time_format: false, picker_utc: true }
      - { name: standfirst, label: Summary, widget: text, hint: "One or two sentences. This is what shows on the homepage card." }
      - { name: body, label: Post, widget: markdown }

  # ----------------------------------------------------------- Page content
  - name: settings
    label: Page content
    files:
      - name: site
        label: All page text
        file: src/_data/site.json
        fields:
          - { name: title, label: Site name, widget: string }
          - { name: legal_name, label: Legal name, widget: string }
          - { name: meta_description, label: Search-result description, widget: text, hint: "Shown under the title in Google results. Around 150 characters." }

          - name: hero
            label: Top of the page
            widget: object
            fields:
              - { name: line, label: Headline, widget: string }
              - { name: sub, label: Paragraph under the headline, widget: text }
              - { name: primary_label, label: Main button text, widget: string }
              - { name: secondary_label, label: Second button text, widget: string }

          - name: about
            label: About section
            widget: object
            fields:
              - { name: eyebrow, label: Small label above the heading, widget: string }
              - { name: heading, label: Heading, widget: string }
              - { name: lede, label: Opening line, widget: text }
              - { name: body, label: Body, widget: text, hint: "Leave a blank line between paragraphs." }
              - { name: pull_quote, label: Pull quote, widget: text, required: false, hint: "The indented italic line. Leave empty to hide it." }

          - { name: services_heading, label: Services heading, widget: string }
          - name: services
            label: Services
            label_singular: Service
            widget: list
            summary: "{{title}}"
            fields:
              - { name: label, label: Small label, widget: string }
              - { name: title, label: Title, widget: string }
              - { name: body, label: Description, widget: text }

          - { name: authors_heading, label: Authors heading, widget: string }

          - name: submissions
            label: Submissions section
            widget: object
            fields:
              - { name: heading, label: Heading, widget: string }
              - { name: open, label: Open for submissions, widget: boolean, default: true, hint: "Turn off to hide the guidelines and show the closed message instead." }
              - { name: closed_message, label: Closed message, widget: text }
              - { name: guidelines, label: What to send, widget: list, field: { name: item, label: Item, widget: string } }
              - name: steps
                label: How it works
                label_singular: Step
                widget: list
                summary: "{{title}}"
                fields:
                  - { name: title, label: Step title, widget: string }
                  - { name: body, label: Step description, widget: text }

          - { name: notes_eyebrow, label: Notes small label, widget: string }
          - { name: notes_heading, label: Notes heading, widget: string }

          - name: contact
            label: Contact section
            widget: object
            fields:
              - { name: heading, label: Heading, widget: string }
              - { name: submissions_email, label: Submissions email, widget: string }
              - { name: general_email, label: General email, widget: string }
              - { name: response_time, label: Response time, widget: string }
              - { name: note, label: Note beside the form, widget: text }
              - { name: form_endpoint, label: Form endpoint, widget: string, required: false, hint: "Paste a Formspree or Tally form address here to receive messages as email. Leave empty and the form opens the visitor's mail app instead." }
